schema_version: 1

source:
  provider: yahoo_finance
  client: yfinance

state_street:
  nav_history_url_template: >-
    https://www.ssga.com/us/en/intermediary/library-content/products/fund-data/etfs/us/navhist-us-en-{ticker_lower}.xlsx

price_history:
  interval: 1d
  auto_adjust: false
  initial_period: max
  incremental_overlap_days: 5

etfs:
  - sector_id: communication_services
    sector_name: Communication Services
    sector_name_cn: 通信服务
    ticker: XLC
    fund_history_filename: xlc_communication_services.csv

  - sector_id: consumer_discretionary
    sector_name: Consumer Discretionary
    sector_name_cn: 可选消费
    ticker: XLY
    fund_history_filename: xly_consumer_discretionary.csv

  - sector_id: consumer_staples
    sector_name: Consumer Staples
    sector_name_cn: 必选消费
    ticker: XLP
    fund_history_filename: xlp_consumer_staples.csv

  - sector_id: energy
    sector_name: Energy
    sector_name_cn: 能源
    ticker: XLE
    fund_history_filename: xle_energy.csv

  - sector_id: financials
    sector_name: Financials
    sector_name_cn: 金融
    ticker: XLF
    fund_history_filename: xlf_finance.csv

  - sector_id: health_care
    sector_name: Health Care
    sector_name_cn: 医疗保健
    ticker: XLV
    fund_history_filename: xlv_health_care.csv

  - sector_id: industrials
    sector_name: Industrials
    sector_name_cn: 工业
    ticker: XLI
    fund_history_filename: xli_industrials.csv

  - sector_id: materials
    sector_name: Materials
    sector_name_cn: 原材料
    ticker: XLB
    fund_history_filename: xlb_materials.csv

  - sector_id: real_estate
    sector_name: Real Estate
    sector_name_cn: 房地产
    ticker: XLRE
    fund_history_filename: xlre_real_estate.csv

  - sector_id: information_technology
    sector_name: Information Technology
    sector_name_cn: 信息技术
    ticker: XLK
    fund_history_filename: xlk_information_technology.csv

  - sector_id: utilities
    sector_name: Utilities
    sector_name_cn: 公用事业
    ticker: XLU
    fund_history_filename: xlu_utilities.csv
