schema_version: 2

source:
  provider: yahoo_finance
  client: yfinance

state_street:
  nav_history_url_template: >-
    https://www.ssga.com/us/en/intermediary/library-content/products/fund-data/etfs/us/navhist-us-en-{ticker_lower}.xlsx

ishares:
  product_page_url_template: >-
    https://www.blackrock.com/us/individual/products/{product_id}/{product_slug}
  fund_download_url_template: >-
    https://www.blackrock.com/varnish-api/blk-one01-product-data/product-data/api/v1/get-fund-document?appSubType=ISHARES&appType=PRODUCT_PAGE&component=fundDownload&locale=en_US&portfolioId={product_id}&targetSite=us-ishares&userType=individual

price_history:
  interval: 1d
  auto_adjust: false
  initial_period: max
  incremental_overlap_days: 5

universes:
  primary_sector:
    - XLC
    - XLY
    - XLP
    - XLE
    - XLF
    - XLV
    - XLI
    - XLB
    - XLRE
    - XLK
    - XLU
  leadership:
    - XLC
    - XLY
    - XLP
    - XLE
    - XLF
    - XLV
    - XLI
    - XLB
    - XLRE
    - XLK
    - XLU
    - SOXX
    - IGV

etfs:
  - sector_id: communication_services
    sector_name: Communication Services
    sector_name_cn: 通信服务
    ticker: XLC
    classification_level: sector
    fund_data_provider: state_street
    fund_history_filename: xlc_communication_services.csv
    metrics_filename: xlc_communication_services.csv

  - sector_id: consumer_discretionary
    sector_name: Consumer Discretionary
    sector_name_cn: 可选消费
